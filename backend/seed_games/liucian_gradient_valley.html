<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liucian's Gradient Valley</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;font-family:Manrope,Inter,system-ui,sans-serif;color:#eaf2ff}
body{background:#0d1730}
.app{height:100%;display:grid;grid-template-rows:52px minmax(0,1fr) 62px;grid-template-columns:minmax(0,1fr) 250px;gap:8px;padding:8px}
.hud,.dock{grid-column:1/-1}
.hud{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand{font-weight:800}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.pill{background:#162445;border:1px solid #31497a;border-radius:999px;padding:5px 10px;font-size:12px}
.pill b{color:#fff}
.stage{position:relative;border-radius:18px;overflow:hidden;min-height:0}
.stage svg{width:100%;height:100%;display:block}
.rail{background:#12203c;border:1px solid #31497a;border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:0}
.rail h2{margin:0;font-size:13px;color:#8fd0ff}
.tiny{font-size:12px;line-height:1.35;color:#c7d6f0}
.math{font-family:ui-monospace,monospace;font-size:11px;background:#0b1428;border-radius:8px;padding:6px 8px}
.dock{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;background:#2a4578;color:#fff}
button.primary{background:#3d8cff}button.ghost{background:#162445;color:#c7d6f0}
button:disabled{opacity:.4;cursor:not-allowed}
label.sl{font-size:12px;display:flex;align-items:center;gap:8px}
input[type=range]{width:150px}
.fb{flex:1;min-width:160px;font-size:13px;font-weight:700}
.good{color:#9be37a}.bad{color:#ffb3a6}
@media(max-width:860px){.app{grid-template-columns:1fr;grid-template-rows:48px minmax(0,1fr) auto 70px}.rail{max-height:88px}}
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="brand">⛰️ Gradient Valley</div>
    <div class="pills">
      <span class="pill">Valley <b id="mLevel">1/3</b></span>
      <span class="pill">Steps <b id="mSteps">16</b></span>
      <span class="pill">Loss <b id="mLoss">—</b></span>
      <span class="pill">η <b id="mLr">0.30</b></span>
      <span class="pill">Won <b id="won">0/3</b></span>
    </div>
  </header>
  <section class="stage">
    <svg id="plot" viewBox="0 0 1100 560" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1b2a58"/><stop offset=".55" stop-color="#4a2a5c"/><stop offset="1" stop-color="#1d3a2a"/>
        </linearGradient>
        <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6aa0d8"/><stop offset="1" stop-color="#21402c"/>
        </linearGradient>
      </defs>
      <rect width="1100" height="560" fill="url(#dusk)"/>
      <circle cx="160" cy="70" r="8" fill="#f7f0c8" opacity=".7"/>
      <circle cx="980" cy="50" r="3" fill="#fff" opacity=".8"/>
      <circle cx="900" cy="90" r="2" fill="#fff" opacity=".7"/>
      <path id="fill" fill="url(#land)" opacity=".95"/>
      <path id="curve" fill="none" stroke="#d7ecff" stroke-width="4"/>
      <g id="trail"></g>
      <g id="arrow"></g>
      <g id="fish"></g>
      <g id="cat"></g>
    </svg>
  </section>
  <aside class="rail">
    <h2>Step downhill</h2>
    <div class="tiny" id="hint">Moderate η. Space = one step. Enter = run.</div>
    <div class="math" id="upd">x ← x − η · dL/dx</div>
    <div class="tiny">Too small stalls. Too large flies off. Valley 3 has a local trap.</div>
    <div class="tiny" id="challenge">Reach the fish in all 3 valleys.</div>
  </aside>
  <footer class="dock">
    <label class="sl">Learning rate <b id="lrOut">0.30</b>
      <input id="lr" type="range" min="0.02" max="1.20" value="0.30" step="0.02">
    </label>
    <button class="primary" id="stepBtn" type="button">Step</button>
    <button class="ghost" id="runBtn" type="button">Run</button>
    <button class="ghost" id="nextBtn" type="button" disabled>Next valley</button>
    <button class="ghost" id="resetBtn" type="button">Replay</button>
    <div class="fb" id="feedback">Aim for the fish at the bottom.</div>
  </footer>
</div>
<script>
(() => {
  const lp = window.LearnPlay || {score(){},answer(){},taskStart(){},taskEnd(){},complete(){}};
  const $ = id => document.getElementById(id);
  const xmin=-4.5,xmax=4.5,W=1100,H=430,pad=50,ymax=8.2,baseY=500;
  const sx = x => pad + (x-xmin)/(xmax-xmin)*(W-2*pad);
  const sy = y => 40 + (1-(Math.min(ymax,Math.max(0,y))/ymax))*(H-40);
  const levels = [
    {name:"one bowl",L:x=>0.35*(x-1.2)**2+0.4,d:x=>0.7*(x-1.2),start:-3.2,goal:1.2,steps:16,hint:"Single valley. Moderate η. Too large oscillates."},
    {name:"steep walls",L:x=>0.55*(x+0.4)**2+0.35,d:x=>1.1*(x+0.4),start:2.5,goal:-0.4,steps:12,hint:"Steeper bowl. Tiny η runs out of steps."},
    {name:"local trap",L:x=>0.14*(x*x-2.6)**2+0.12*x+0.4,d:x=>0.56*x*(x*x-2.6)+0.12,start:3.0,goal:-1.64,steps:24,hint:"Two bowls. Tiny η traps on the right. Moderate η skips left. Huge η flies."}
  ];
  let level=0,x,steps,done=false,wins=0,running=false,trail=[],timer=null,visX;
  function add(tag,attrs,p){const e=document.createElementNS("http://www.w3.org/2000/svg",tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));p.appendChild(e);return e}
  function landPath(){
    const lv=levels[level]; let d=`M 0 ${baseY}`;
    for(let i=0;i<=140;i++){
      const xv=xmin+(xmax-xmin)*i/140, y=Math.min(ymax,lv.L(xv));
      d+=` L ${sx(xv)} ${sy(y)}`;
    }
    d+=` L ${W} ${baseY} Z`;
    return d;
  }
  function curvePath(){
    const lv=levels[level]; let d="";
    for(let i=0;i<=140;i++){
      const xv=xmin+(xmax-xmin)*i/140, y=Math.min(ymax,lv.L(xv));
      d+=(i?"L":"M")+sx(xv)+" "+sy(y)+" ";
    }
    return d;
  }
  function draw(px){
    const lv=levels[level]; const xx = px==null?x:px;
    $("fill").setAttribute("d",landPath());
    $("curve").setAttribute("d",curvePath());
    const tr=$("trail"); tr.innerHTML="";
    trail.forEach((tx,i)=>{
      add("circle",{cx:sx(tx),cy:sy(lv.L(tx)),r:3.2,fill:"#d7ecff",opacity:.25+i/Math.max(trail.length,1)*.6},tr);
    });
    const fish=$("fish"); fish.innerHTML="";
    add("text",{x:sx(lv.goal),y:sy(lv.L(lv.goal))-14,"text-anchor":"middle","font-size":26},fish).textContent="🐟";
    const g=lv.d(xx), ax=sx(xx), ay=sy(lv.L(xx));
    const ag=$("arrow"); ag.innerHTML="";
    const dir = g>0?-36:36;
    add("line",{x1:ax,y1:ay-8,x2:ax+dir,y2:ay-8,stroke:"#ffd36a","stroke-width":3,"stroke-linecap":"round"},ag);
    const cat=$("cat"); cat.innerHTML="";
    add("ellipse",{cx:ax,cy:ay-10,rx:18,ry:14,fill:"#c9a27a",stroke:"#2a1d16","stroke-width":2},cat);
    add("circle",{cx:ax+12,cy:ay-20,r:9,fill:"#d4b08a"},cat);
    add("text",{x:ax,y:ay-34,"text-anchor":"middle",fill:"#eaf2ff","font-size":12,"font-weight":800},cat).textContent="Liucian";
    $("mLoss").textContent=lv.L(x).toFixed(2);
    $("mSteps").textContent=steps; $("mLevel").textContent=`${level+1}/3`;
    $("mLr").textContent=(+$("lr").value).toFixed(2); $("lrOut").textContent=(+$("lr").value).toFixed(2);
  }
  function startLevel(){
    const lv=levels[level];
    x=lv.start; visX=x; steps=lv.steps; done=false; running=false; trail=[x];
    $("nextBtn").disabled=true; $("stepBtn").disabled=false; $("runBtn").disabled=false;
    $("hint").textContent=lv.hint; $("feedback").className="fb";
    $("feedback").textContent=`Valley ${level+1}: ${lv.name}.`;
    lp.taskStart("valley-"+level); draw();
  }
  function animateTo(nx, cb){
    const start=visX, t0=performance.now();
    const tick=(t)=>{
      const u=Math.min(1,(t-t0)/180);
      visX=start+(nx-start)*u; draw(visX);
      if(u<1) requestAnimationFrame(tick); else { visX=nx; cb&&cb(); }
    };
    requestAnimationFrame(tick);
  }
  function step(){
    if(done) return false;
    const lv=levels[level], eta=+$("lr").value, g=lv.d(x), nx=x-eta*g;
    $("upd").textContent=`x ← ${x.toFixed(2)} − ${eta.toFixed(2)} · (${g.toFixed(2)}) = ${nx.toFixed(2)}`;
    x=nx; steps--; trail.push(x); if(trail.length>18) trail.shift();
    animateTo(nx);
    if(!isFinite(x)||Math.abs(x)>5.2){ fail("Flew off the ridge. Huge η explodes."); return false; }
    if(Math.abs(x-lv.goal)<0.28){ succeed(); return false; }
    if(steps<=0){ fail("Out of steps. η too small, or stuck in a local bowl."); return false; }
    return true;
  }
  function succeed(){
    done=true; wins++; $("won").textContent=`${wins}/3`;
    $("stepBtn").disabled=true; $("runBtn").disabled=true;
    $("feedback").className="fb good"; $("feedback").textContent="🐟 Reached the fish.";
    lp.taskEnd("valley-"+level); lp.answer({correct:true,taskId:"valley-"+level,points:20}); lp.score(20);
    if(level<2) $("nextBtn").disabled=false; else wrap();
  }
  function fail(msg){
    done=true; $("stepBtn").disabled=true; $("runBtn").disabled=true;
    $("feedback").className="fb bad"; $("feedback").textContent=msg;
    lp.taskEnd("valley-"+level); lp.answer({correct:false,taskId:"valley-"+level,points:0});
    if(level<2) $("nextBtn").disabled=false; else wrap();
  }
  function wrap(){
    const pass=wins>=2;
    $("challenge").innerHTML=pass?`⭐ ${wins}/3 valleys.`:`Solved ${wins}/3. Tune η — then retry.`;
    $("challenge").className=pass?"good":"bad";
    lp.complete({score:wins*20});
  }
  function run(){
    if(running||done) return; running=true;
    timer=setInterval(()=>{ if(!step()){ clearInterval(timer); running=false; } },220);
  }
  $("lr").oninput=()=>{ $("mLr").textContent=(+$("lr").value).toFixed(2); $("lrOut").textContent=(+$("lr").value).toFixed(2); };
  $("stepBtn").onclick=()=>{ if(!running) step(); };
  $("runBtn").onclick=run;
  $("nextBtn").onclick=()=>{ clearInterval(timer); running=false; level++; startLevel(); };
  $("resetBtn").onclick=()=>{ clearInterval(timer); running=false; level=0; wins=0; $("won").textContent="0/3"; $("challenge").textContent="Reach the fish in all 3 valleys."; startLevel(); };
  window.addEventListener("keydown",e=>{
    if(e.key===" "){ e.preventDefault(); if(!running) step(); }
    if(e.key==="Enter") run();
  });
  startLevel();
})();
</script>
</body>
</html>
