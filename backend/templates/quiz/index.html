<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz</title>
  <style>
    :root {
      --bg: #0c1220;
      --ink: #eef4fb;
      --muted: #9aabc4;
      --accent: #3ec8e8;
      --card: #121a2c;
      --line: rgba(62, 200, 232, 0.22);
      --good: #3dba7a;
      --bad: #e05b74;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Exo 2", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.55;
      font-size: 17px;
    }
    main { max-width: 720px; margin: 0 auto; padding: 28px 18px 60px; }
    h1 { font-size: 1.45rem; font-weight: 650; margin: 0 0 8px; letter-spacing: 0; }
    .sub { color: var(--muted); margin: 0 0 18px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
      margin-top: 14px;
    }
    button {
      cursor: pointer;
      border: 1px solid var(--line);
      background: #0c1220;
      color: var(--ink);
      border-radius: 10px;
      padding: 12px 14px;
      margin: 6px 0 0;
      font: inherit;
      text-align: left;
    }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:disabled { opacity: .55; cursor: default; }
    .opt { display: block; width: 100%; }
    .opt.good { border-color: var(--good); background: rgba(61, 186, 122, 0.16); }
    .opt.bad { border-color: var(--bad); background: rgba(224, 91, 116, 0.16); }
    .bar { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: .95rem; }
    .bar b { color: var(--ink); }
  </style>
</head>
<body>
<main>
  <h1 id="title">Quiz</h1>
  <p class="sub" id="desc"></p>
  <div class="bar">
    <span>Score: <b id="score">0</b></span>
    <span>Question: <b id="progress">0/0</b></span>
  </div>
  <div class="card" id="panel"></div>
</main>
<script>
async function load() {
  const res = await fetch('./content.json');
  const data = await res.json();
  document.getElementById('title').textContent = data.title || 'Quiz';
  document.getElementById('desc').textContent = data.description || '';
  const questions = data.questions || [];
  let i = 0, score = 0;
  const panel = document.getElementById('panel');
  const scoreEl = document.getElementById('score');
  const prog = document.getElementById('progress');

  function render() {
    prog.textContent = `${Math.min(i+1, questions.length)}/${questions.length}`;
      if (i >= questions.length) {
      panel.innerHTML = `<p>Done! Final score: <b>${score}</b></p>`;
      if (window.LearnPlay) LearnPlay.complete({ score, levelsCompleted: questions.length, totalLevels: questions.length });
      return;
    }
    const q = questions[i];
    if (window.LearnPlay) LearnPlay.taskStart(q.id);
    panel.innerHTML = `<p><b>${q.prompt}</b></p>` + (q.options||[]).map((o, idx) =>
      `<button class="opt" data-idx="${idx}">${o.text}</button>`
    ).join('');
    panel.querySelectorAll('.opt').forEach(btn => {
      btn.addEventListener('click', () => {
        const opt = q.options[Number(btn.dataset.idx)];
        const correct = !!opt.correct;
        panel.querySelectorAll('.opt').forEach(b => b.disabled = true);
        btn.classList.add(correct ? 'good' : 'bad');
        if (window.LearnPlay) {
          LearnPlay.taskEnd(q.id);
          LearnPlay.answer({ correct, taskId: q.id, points: q.points || 10 });
          if (correct) LearnPlay.score(q.points || 10);
        }
        if (correct) { score += (q.points || 10); scoreEl.textContent = score; }
        if (window.LearnPlay) LearnPlay.progress({ level: i + 1, totalLevels: questions.length });
        setTimeout(() => { i += 1; render(); }, 550);
      });
    });
  }
  render();
}
load().catch(err => { document.getElementById('panel').textContent = String(err); });
</script>
</body>
</html>
