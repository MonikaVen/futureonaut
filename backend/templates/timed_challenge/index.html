<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timed Challenge</title>
  <style>
    :root {
      --bg: #0c1220;
      --ink: #eef4fb;
      --muted: #9aabc4;
      --accent: #3ec8e8;
      --card: #121a2c;
      --line: rgba(62, 200, 232, 0.22);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Exo 2", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      line-height: 1.55;
      font-size: 17px;
    }
    main { max-width: 680px; margin: 0 auto; padding: 28px 16px; }
    h1 { margin: 0 0 8px; font-size: 1.45rem; font-weight: 650; }
    .muted { color: var(--muted); }
    .muted b { color: var(--ink); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
      margin-top: 14px;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #0c1220;
      color: var(--ink);
      font: inherit;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button {
      margin-top: 10px;
      background: var(--accent);
      color: #050810;
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
<main>
  <h1 id="title">Timed Challenge</h1>
  <p class="muted" id="desc"></p>
  <div class="muted">Score: <b id="score">0</b> · Time left: <b id="timer">-</b>s</div>
  <div class="card" id="panel"></div>
</main>
<script>
async function load() {
  const data = await (await fetch('./content.json')).json();
  document.getElementById('title').textContent = data.title || 'Timed Challenge';
  document.getElementById('desc').textContent = data.description || '';
  const items = data.items || [];
  let i = 0, score = 0, timer = null;
  const panel = document.getElementById('panel');
  const scoreEl = document.getElementById('score');
  const timerEl = document.getElementById('timer');

  function clearTimer() { if (timer) { clearInterval(timer); timer = null; } }

  function next() {
    clearTimer();
    if (i >= items.length) {
      panel.innerHTML = `<p>Finished! Score: <b>${score}</b></p>`;
      if (window.LearnPlay) LearnPlay.complete({ score, levelsCompleted: items.length, totalLevels: items.length });
      return;
    }
    const item = items[i];
    let left = Math.round((item.time_limit_ms || 30000) / 1000);
    timerEl.textContent = left;
    if (window.LearnPlay) LearnPlay.taskStart(item.id);
    panel.innerHTML = `<p><b>${item.prompt}</b></p><input id="ans" placeholder="Your answer" /><button id="go">Submit</button>`;
    const input = document.getElementById('ans');
    input.focus();
    timer = setInterval(() => {
      left -= 1;
      timerEl.textContent = left;
      if (left <= 0) {
        clearTimer();
        if (window.LearnPlay) {
          LearnPlay.taskEnd(item.id);
          LearnPlay.answer({ correct: false, taskId: item.id, points: item.points || 10 });
        }
        i += 1;
        if (window.LearnPlay) LearnPlay.progress({ level: i, totalLevels: items.length });
        next();
      }
    }, 1000);
    function submit() {
      const val = (input.value || '').trim().toLowerCase();
      const correct = val === String(item.answer || '').trim().toLowerCase();
      clearTimer();
      if (window.LearnPlay) {
        LearnPlay.taskEnd(item.id);
        LearnPlay.answer({ correct, taskId: item.id, points: item.points || 10 });
        if (correct) LearnPlay.score(item.points || 10);
      }
        if (correct) { score += item.points || 10; scoreEl.textContent = score; }
      i += 1;
      if (window.LearnPlay) LearnPlay.progress({ level: i, totalLevels: items.length });
      next();
    }
    document.getElementById('go').onclick = submit;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  }
  next();
}
load();
</script>
</body>
</html>
