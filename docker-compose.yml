services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: learnplay
      POSTGRES_PASSWORD: learnplay
      POSTGRES_DB: learnplay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnplay -d learnplay"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://learnplay:learnplay@db:5432/learnplay
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-learnplay-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      CREATOR_EMAIL: ${CREATOR_EMAIL:-futureonaut@example.com}
      CREATOR_PASSWORD: ${CREATOR_PASSWORD:-futureonaut}
      CREATOR_NAME: ${CREATOR_NAME:-Futureonaut}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3080,http://localhost:3000}
      GAMES_DIR: /data/games
    volumes:
      - games_data:/data/games
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  games_data:
